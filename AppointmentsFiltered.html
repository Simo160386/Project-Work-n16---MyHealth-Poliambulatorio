<!DOCTYPE html>
<html>


<head>

    <title>Visite Prenotate</title>

    <link rel="stylesheet" href="style.css">

</head>




<body>

<div class="container">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
    ">

        <h1>Lista Visite</h1>

        <button
            class="btn-red"
            style="width:220px;"
            onclick="goBackDashboard()">

            DASHBOARD

        </button>

    </div>

<!-- DOWNLOAD -->

<div class="download-buttons">

    <button
        class="btn-blue"
        onclick="downloadPDF()">

        ⬇️ DOWNLOAD PDF

    </button>

    <button
        class="btn-purple"
        onclick="downloadDOC()">

        ⬇️ DOWNLOAD DOC

    </button>

</div>

<div id="appointmentsCounters" class="appointments-counters">

    <div class="counter-card">

        <span class="counter-number" id="totalAppointments">
            0
        </span>

        <span class="counter-label">
            Totali
        </span>

    </div>

    <div class="counter-card completed">

        <span class="counter-number" id="completedAppointments">
            0
        </span>

        <span class="counter-label">
            Erogate
        </span>

    </div>

    <div class="counter-card pending">

        <span class="counter-number" id="pendingAppointments">
            0
        </span>

        <span class="counter-label">
            Non Erogate
        </span>

    </div>

</div>






    <!-- TABELLA -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>TIPOLOGIA VISITA</th>

                    <th>PAZIENTE</th>

                    <th>MEDICO</th>

                    <th>DATA</th>

                    <th>ORA</th>
		    
		    <th>STATO</th>

                </tr>

            </thead>

            <tbody id="appointmentsBody">

            </tbody>

        </table>

    </div>

</div>

<!-- jsPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



<!-- jsPDF AUTOTABLE -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>



<!-- FILE SAVER -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script src="AppointmentsFiltered.js"></script>



</body>


</html>
